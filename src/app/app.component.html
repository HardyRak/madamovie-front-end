<ion-app>
  <ion-menu contentId="main-content" *ngIf="onSession()">
    <ion-header>
      <ion-toolbar color="tertiary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item routerLink="/principale" button>
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Principale</ion-label>
        </ion-item>
        <ion-item routerLink="/abonnement/form" button>
          <ion-icon slot="start" name="person-outline"></ion-icon>
          <ion-label>Abonnement</ion-label>
        </ion-item>        
        <ion-item button routerLink="/settings">
          <ion-icon slot="start" name="settings-outline"></ion-icon>
          <ion-label>Paramètre</ion-label>
        </ion-item>
        <ion-item button>
          <ion-icon slot="start" name="information-circle-outline"></ion-icon>
          <ion-label>A propos</ion-label>
        </ion-item>
        <ion-item button (click)="logOut()">
          <ion-icon style="color: rgb(111, 30, 30);" slot="start" name="log-out-outline"></ion-icon>
          <ion-label>Deconnexion</ion-label>
        </ion-item>        
      </ion-list>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
