<ion-app>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Login</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col class="ion-text-center">
          <ion-title>Bienvenue</ion-title>
          <ion-title>Connectez vous ici</ion-title>
        </ion-col>
      </ion-row>
    </ion-grid>
    <form (ngSubmit)="login()">
      <ion-list>
        <ion-item>
          <ion-input [(ngModel)]="credentials.email" type="email" name="email" placeholder="Votre E-mail" required>
            <div slot="label">Email:</div>
          </ion-input>
        </ion-item>
        <ion-item>
          <ion-input [(ngModel)]="credentials.motDePasse" type="password" name="motDePasse" placeholder="Votre mot de passe" required>
            <div slot="label">Mot de passe:</div>
          </ion-input>
        </ion-item>
      </ion-list>
      <ion-button expand="full" type="submit">Se connecter</ion-button>
    </form>
    <a class="ion-button" href="/inscription">Nouveau? créé votre compte gratuitement</a>
    <ion-text color="danger" *ngIf="errorMessage">
      <p>{{ errorMessage }}</p>
    </ion-text>
    <ion-text color="danger" *ngIf="ipcon">
      <p>{{ ipcon }}</p>
    </ion-text>
  </ion-content>
  
</ion-app>
